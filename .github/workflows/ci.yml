name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ruff
        run: pip install ruff==0.6.9

      - name: Executar ruff
        run: ruff check src/ tests/ scripts/ databricks/notebooks/

  test:
    name: Testes (PySpark + Delta)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17 (dependencia do PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias e o pacote transforms
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      # Cobertura medida sobre o codigo do pipeline (src/transforms), que e o mesmo
      # importado pelos notebooks. O minimo (fail_under) esta no pyproject.toml.
      - name: Executar testes unitarios e de integracao Delta
        run: pytest tests/ --cov=src/transforms --cov-report=xml --cov-report=term-missing

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  terraform-validate:
    name: Validacao Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.4"

      - name: Verificacao de formatacao Terraform
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform Init (sem backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate
