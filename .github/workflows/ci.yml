name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar ruff
        run: pip install ruff==0.4.9

      - name: Executar ruff
        run: ruff check databricks/notebooks/ tests/ scripts/

  test:
    name: Testes Unitarios (PySpark)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 11 (dependencia do PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Executar testes unitarios
        run: pytest tests/unit/ -v --tb=short --cov=tests --cov-report=xml

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  terraform-validate:
    name: Validacao Terraform
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.4"

      - name: Terraform Init (sem backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: infra
        run: terraform validate

      - name: Verificacao de formatacao Terraform
        working-directory: infra
        run: terraform fmt -check -recursive
