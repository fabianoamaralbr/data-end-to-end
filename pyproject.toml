[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-transforms"
version = "0.2.0"
description = "Transformacoes do pipeline medallion (bronze/silver/gold) usadas pelos notebooks Databricks"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks Databricks: globais injetados pelo runtime e celulas com imports apos sys.path
"databricks/notebooks/*.py" = ["F821", "E402", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["transforms"]

[tool.coverage.run]
source = ["src/transforms"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
